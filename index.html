<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Voice Assistant</title>
    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --text-color: #333;
            --bg-color: #ffffff;
            --danger-color: #dc3545;
        }
        body, html {
            height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; text-align: center;
        }
        .container {
            padding: 20px; width: 90%; max-width: 400px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; height: 90vh;
        }
        #status { font-size: 1.2em; color: #666; height: 60px; display: flex; align-items: center; justify-content: center; }
        
        #speakButton {
            width: 160px; height: 160px; border-radius: 50%; border: none; background-color: var(--primary-color);
            color: white; font-size: 1.5em; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.2s; display: flex; justify-content: center; align-items: center; text-align: center;
        }
        #speakButton:hover, #speakButton:focus { background-color: #0056b3; outline: none; }
        #speakButton.listening { background-color: var(--danger-color); transform: scale(1.05); }
        
        #importBtn {
            margin-top: 30px; padding: 12px 24px; border-radius: 25px; border: none; background-color: var(--secondary-color);
            color: white; font-size: 1em; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        #result { margin-top: 20px; font-size: 1.1em; min-height: 50px; }
        .footer { font-size: 0.8em; color: #aaa; margin-top: auto;}
    </style>
</head>
<body>
    <div class="container">
        <div id="status">Tap the button to start speaking</div>
        
        <button id="speakButton">Tap to Speak</button>
        
        <button id="importBtn">📲 Import Contacts</button>

        <div id="result">
            <p id="heardText"></p>
            <p id="responseText"></p>
        </div>
        
        <div class="footer">Senior Voice Assistant Prototype</div>
    </div>

    <script>
        const speakButton = document.getElementById('speakButton');
        const importBtn = document.getElementById('importBtn');
        const statusDiv = document.getElementById('status');
        const heardTextP = document.getElementById('heardText');
        const responseTextP = document.getElementById('responseText');
        
        // App Memory: Store imported contacts here
        let myContacts = {};

        // 1. --- Contact Picker Logic ---
        importBtn.addEventListener('click', async () => {
            // Check if browser supports the Contact Picker API
            if ('contacts' in navigator && 'ContactsManager' in window) {
                try {
                    const props = ['name', 'tel'];
                    const opts = { multiple: true };
                    const contacts = await navigator.contacts.select(props, opts);
                    
                    if (contacts.length > 0) {
                        let count = 0;
                        contacts.forEach(contact => {
                            if (contact.name && contact.name.length > 0 && contact.tel && contact.tel.length > 0) {
                                // Save lowercase name for easier voice matching
                                const name = contact.name[0].toLowerCase();
                                myContacts[name] = contact.tel[0];
                                count++;
                            }
                        });
                        speak(`Successfully imported ${count} contacts.`);
                        statusDiv.textContent = `${count} contacts ready to call.`;
                        console.log("Current Contacts:", myContacts);
                    }
                } catch (ex) {
                    console.error("Contact import failed", ex);
                    statusDiv.textContent = "Contact import cancelled.";
                }
            } else {
                alert("Your browser does not support the Web Contact Picker API. Please ensure you are using a mobile device and accessing this page via HTTPS.");
            }
        });

        // 2. --- Speech Recognition Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        const synth = window.speechSynthesis;
        let isListening = false;

        if (!recognition) {
            statusDiv.textContent = "Sorry, your browser does not support Speech Recognition.";
            speakButton.disabled = true;
        } else {
            recognition.continuous = false;
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                speakButton.classList.add('listening');
                speakButton.textContent = 'Stop';
                statusDiv.textContent = 'I am listening...';
                heardTextP.textContent = '';
                responseTextP.textContent = '';
            };

            recognition.onend = () => {
                isListening = false;
                speakButton.classList.remove('listening');
                speakButton.textContent = 'Tap to Speak';
                if (statusDiv.textContent === 'I am listening...') {
                    statusDiv.textContent = 'Tap the button to start speaking';
                }
            };

            recognition.onerror = (event) => {
                let errorMsg = `Error: ${event.error}. Please try again.`;
                if(event.error === 'not-allowed') errorMsg = 'Please allow microphone access in settings and use HTTPS.';
                statusDiv.textContent = errorMsg;
                isListening = false;
                speakButton.classList.remove('listening');
                speakButton.textContent = 'Tap to Speak';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                heardTextP.innerHTML = `<strong>I heard:</strong> "${transcript}"`;
                statusDiv.textContent = 'Thinking...';
                processCommand(transcript);
            };

            speakButton.addEventListener('click', (e) => {
                e.preventDefault();
                if (synth && synth.paused) synth.resume();
                if (!isListening) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            });
        }

        function speak(text) {
            if (!synth) return;
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.onend = () => { if(statusDiv.textContent === 'Thinking...') statusDiv.textContent = 'Tap the button to start speaking'; };
            responseTextP.innerHTML = `<strong>My reply:</strong> ${text}`;
            synth.speak(utterance);
        }

        // 3. --- Intent Processing ---
        function processCommand(command) {
            const lowerCommand = command.toLowerCase();

            // Emergency
            if (lowerCommand.includes('help') || lowerCommand.includes('emergency') || lowerCommand.includes('911')) {
                speak("Emergency detected. Dialing 911 now.");
                setTimeout(() => { window.location.href = "tel:911"; }, 3000);
                return;
            }

            // Calling 
            if (lowerCommand.startsWith('call') || lowerCommand.includes('phone')) {
                const searchName = lowerCommand.replace('call', '').replace('phone', '').replace('my', '').trim();
                
                if (searchName) {
                    let foundNumber = null;
                    let foundName = null;
                    
                    // Fuzzy match: check if spoken name is inside any of our saved contacts
                    for (const [contactName, phoneNum] of Object.entries(myContacts)) {
                        if (contactName.includes(searchName) || searchName.includes(contactName)) {
                            foundNumber = phoneNum;
                            foundName = contactName;
                            break;
                        }
                    }

                    if (foundNumber) {
                        speak(`Calling ${foundName} now.`);
                        setTimeout(() => { window.location.href = `tel:${foundNumber}`; }, 2500);
                    } else {
                        speak(`I couldn't find a phone number for ${searchName}. Did you import their contact?`);
                    }
                } else {
                    speak("Who would you like to call?");
                }
                return;
            }

            // Uber/Ride
            if (lowerCommand.includes('uber') || lowerCommand.includes('lyft') || lowerCommand.includes('ride')) {
                const destination = lowerCommand.replace(/.*?(uber|lyft|ride to|take me to)\s*/, '').trim();
                speak(destination ? `Booking a ride to ${destination}. Please confirm in the app.` : "Where would you like to go?");
                return;
            }

            // Default
            speak("I'm sorry, I didn't understand. Try saying 'Call John' or 'Help'.");
        }
    </script>
</body>
</html>
